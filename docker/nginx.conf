user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'upstream: "$upstream_addr" status: "$upstream_status"';
    access_log  /var/log/nginx/access.log  main;

    # 性能与传输
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  30;
    client_max_body_size 50m;

    # Gzip 压缩配置
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 2048;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # 后端网关 upstream
    upstream gateway_backend {
        server gateway:30001 weight=1 max_fails=2 fail_timeout=10s;
        keepalive 32;
    }

    # 现代设备类型识别（保留主流特征，默认回落 PC）
    map $http_user_agent $device {
        ~*(android|iphone|ipad|mobile|harmonyos|micromessenger) mobile;
        default pc;
    }

    server {
        listen       3000;
        server_name  _;

        # 核心：root 声明在 server 级，全站默认根据 $device 指向对应双端目录
        root /usr/share/nginx/$device;

        # 安全标头
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        # 核心防坑：告知下游/CDN 响应内容随 UA 变化，避免手机缓存 PC 页面
        add_header Vary "User-Agent" always;

        # 1. API 接口代理（转发到 Spring Cloud Gateway）
        location /api/ {
            proxy_pass http://gateway_backend/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # 2. Garage 对象存储桶反向代理（支持任意 xxx-bucket）
        location ~* ^/(?<bucket_name>[a-zA-Z0-9_-]+-bucket)/(.*)$ {
            rewrite ^/[a-zA-Z0-9_-]+-bucket/(.*)$ /$1 break;
            proxy_pass http://garage:3902;
            proxy_http_version 1.1;
            proxy_set_header Host $bucket_name.web.garage.lan;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 100m;
        }

        # 3. SPA 入口文件（禁止缓存）
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            add_header Vary "User-Agent" always;
        }

        # 4. Vite 打包静态资源（带 contenthash，强缓存 1 年，自动继承 root）
        location /static/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # 5. 图片/图标等静态资源（30 天缓存）
        location ~* \.(ico|gif|jpg|jpeg|png|webp|svg|woff2?|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000" always;
        }

        # 6. SPA 路由回退兜底
        location / {
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # 7. 健康检查端点
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # 错误页面
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
