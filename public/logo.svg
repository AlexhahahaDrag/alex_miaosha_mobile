<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Alex Platform · AM Monogram (Premium Neo-Glow Edition) -->
  <defs>
    <!-- Deep Cosmic Gradient -->
    <linearGradient id="am-glow-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="55%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <!-- Gold Coin Gradient -->
    <linearGradient id="am-gold-coin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <!-- Subtle Ambient Glow Filter -->
    <filter id="am-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="am-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <!-- Background with Inset Highlight Stroke -->
  <rect x="6" y="6" width="88" height="88" rx="22" fill="url(#am-glow-bg)"/>
  <rect x="6" y="6" width="88" height="88" rx="22" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
  <!-- Ambient Backlight -->
  <circle cx="82" cy="20" r="14" fill="#60A5FA" opacity="0.3" filter="url(#am-blur)"/>
  <!-- AM Peaks & Crossbar with Ambient Shadow -->
  <g filter="url(#am-glow)">
    <polyline points="20,72 35,34 50,60 65,34 80,72" fill="none" stroke="#FFFFFF" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="26" y1="56" x2="42" y2="56" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
    <!-- Floating Gold Coin with Metallic Sheen -->
    <circle cx="65" cy="24" r="7.5" fill="url(#am-gold-coin)" stroke="#FFFFFF" stroke-width="2.5"/>
    <!-- Precision AI Star -->
    <path d="M82 11 L84.3 17.5 L90.8 19.8 L84.3 22.1 L82 28.6 L79.7 22.1 L73.2 19.8 L79.7 17.5 Z" fill="#FFFFFF"/>
  </g>
</svg>
